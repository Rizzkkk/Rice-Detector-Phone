org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation fails here with "Could not close incremental caches ...
# class-fq-name-to-source.tab". It recurs after a clean build, so it is not stale state - the
# project path contains spaces ("phone rice detector"), which the Kotlin incremental compiler
# has long handled badly on Windows. Full recompilation of the plugins is a few seconds.
kotlin.incremental=false
