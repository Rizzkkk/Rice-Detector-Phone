# nginx site for the rice api. Use this when the box already runs nginx on 80 and 443 for
# other sites, which is the normal case on a shared VPS. Use deploy/Caddyfile instead only on a
# box where nothing else owns those ports.
#
# Caddy cannot share the box: Let's Encrypt validates on port 80 or 443 and nothing else, so if
# nginx holds both there is no port left for Caddy to prove the domain with.
#
# Install:
#   cp deploy/nginx-rice-api.conf /etc/nginx/sites-available/rice-api
#   ln -s /etc/nginx/sites-available/rice-api /etc/nginx/sites-enabled/rice-api
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ricemillstormaxis.duckdns.org
#
# certbot rewrites this file to add the TLS block and the port 80 redirect. That is expected.

server {
    listen 80;
    listen [::]:80;
    server_name ricemillstormaxis.duckdns.org;

    # backstop above the app's own 10MB cap, so an oversized upload dies here rather than
    # tying up the single inference worker while it uploads
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # overwrite, do not append. _client_ip in main.py reads the last entry because caddy
        # appends, and overwriting means a client cannot inject a fake address at all. without
        # this every request looks like it came from the proxy and one rate limit bucket
        # covers everybody.
        proxy_set_header X-Forwarded-For $remote_addr;

        # three models run per request on two cores. the phone gives up at 45s, so this sits
        # above that and lets the app decide when to stop waiting rather than nginx.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
